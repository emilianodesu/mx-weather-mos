[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mx-weather-intel"
version = "0.1.0"
description = "Mexico Weather Forecast Verification & ML Bias-Correction Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.115.0",
    "geoalchemy2>=0.15.2",
    "httpx>=0.28.0",
    "joblib>=1.4.2",
    "lightgbm>=4.5.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "psycopg[binary]>=3.2.0",
    "pyarrow>=18.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "scikit-learn>=1.6.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/mxweather/api/routes/*.py" = ["B008"]
